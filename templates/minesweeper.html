{% extends 'layout.html' %}

{% block body %} 
<style>
    td {
        padding: 0.5rem;
    }
</style>
<body>
    <div class="container">
        <h1>Minesweeper</h1>
        <div class="message">{{ message }}</div>
        <div>
        {% for row in game.grid.grid %}
            <p>
            {% for cell in row %}
                {% if cell.show() == '?' %}
                <a href="/minesweeper?id={{cell.id}}">
                    <button type="button" class="btn btn-secondary btn-lg">{{ cell.show() }}</button>
                </a>
                {% elif cell.show() == 'X' %}
                <a href="/minesweeper?id={{cell.id}}">
                    <button type="button" class="btn btn-danger btn-lg">{{ cell.show() }}</button>
                </a>
                {% else %}
                <a href="/minesweeper?id={{cell.id}}">
                    <button type="button" class="btn btn-light btn-lg">{{ cell.show() }}</button>
                </a>
                {% endif %}
            {% endfor %}
            </p>
        {% endfor %}
        </div>
        <a href="/minesweeper?new=1">New Game</a>
    </div>
</body>

{% endblock %}
